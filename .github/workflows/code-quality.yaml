name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new commit on a pull request cancels the runs of its earlier commits. Push
# runs are never cancelled while running; a newer push only replaces a run that
# is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py-commol

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The toolchain of rust-toolchain.toml, the one every local build uses,
      # so clippy here and in the pre-commit hook has the same lints.
      - name: Set up Rust
        run: rustup toolchain install

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: py-commol/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # The test model kind (`test-kind`) is for the tests only; wheels never
      # have it.
      - name: Build Rust extension
        run: uv run maturin develop --release --features test-kind

      - name: Run Ruff linting
        run: uv run ruff check .

      - name: Run Ruff formatting check
        run: uv run ruff format --check .

      - name: Run Vulture dead code detection
        run: uv run vulture commol .vulture_allowlist.py --min-confidence 80

      - name: Run ty type checking
        run: uv run ty check commol

      - name: Run pytest (including the documentation examples)
        run: uv run pytest --cov=commol --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./py-commol/coverage.xml
          flags: python
          fail_ci_if_error: false

  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The toolchain of rust-toolchain.toml, the one every local build uses,
      # so clippy here and in the pre-commit hook has the same lints.
      - name: Set up Rust
        run: rustup toolchain install

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Public items must have docs (`missing_docs`, denied by clippy above), and
      # their docs must not have broken links.
      - name: Check Rust documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p commol-core -p commol-model -p commol-difference -p commol-differential -p commol-calibration -p commol-random

      - name: Run tests
        run: cargo test --all-features --workspace
