name: Code Quality

on:
  pull_request:
    branches: [main]
  # The merge queue of main tests each pull request on top of the others, so
  # the tree that reaches main is the tree it checked: a push to main does not
  # run the checks again.
  merge_group:
  workflow_dispatch:

# A new commit on a pull request cancels the runs of its earlier commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./py-commol

    # Linters read the source and the stubs (`_commol_rs.pyi`), so this job
    # builds nothing and answers in seconds; the tests run in Python Coverage.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: py-commol/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff linting
        run: uv run ruff check . ../.github/scripts

      - name: Run Ruff formatting check
        run: uv run ruff format --check . ../.github/scripts

      - name: Run Vulture dead code detection
        run: uv run vulture commol .vulture_allowlist.py --min-confidence 80

      - name: Run ty type checking
        run: uv run ty check commol

  # Every test, the documentation examples included, under coverage. It runs
  # for every change, the documentation too, so a page whose example breaks
  # fails here. Coverage slows the tests, so the time budget is measured in
  # the job Test of Build instead (test_slow_tests_are_listed skips here).
  python-coverage:
    name: Python Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./py-commol

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        run: rustup toolchain install

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: py-commol/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # The test model kind (`test-kind`) is for the tests only; wheels never
      # have it.
      - name: Build Rust extension
        run: uv run maturin develop --release --features test-kind

      # The test that compiles the LaTeX description needs latexmk, which the
      # runner does not have.
      - name: Install LaTeX
        run: >-
          sudo apt-get update &&
          sudo apt-get install --no-install-recommends -y latexmk
          texlive-latex-base texlive-latex-recommended texlive-fonts-recommended

      # Every statement of the package runs, except the exclusions of
      # [tool.coverage.report] in pyproject.toml (docs/codebase/tests.md).
      - name: Run pytest (including the documentation examples)
        run: uv run pytest --cov=commol --cov-fail-under=100 --cov-report=xml --cov-report=term --durations=20

      # Codecov authenticates the upload with the OIDC token of the run, so the
      # repository keeps no Codecov secret. A pull request from a fork has no
      # such token: its upload fails without failing the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./py-commol/coverage.xml
          flags: python
          use_oidc: true
          fail_ci_if_error: false

  rust-quality:
    name: Rust Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # The toolchain of rust-toolchain.toml, the one every local build uses,
      # so clippy here and in the pre-commit hook has the same lints.
      - name: Set up Rust
        run: rustup toolchain install

      # cargo llvm-cov instruments the tests with the LLVM tools of the
      # toolchain; local builds do not need them, so rust-toolchain.toml does
      # not list them.
      - name: Set up the coverage tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run rustfmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Public items must have docs (`missing_docs`, denied by clippy above), and
      # their docs must not have broken links.
      - name: Check Rust documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p commol-core -p commol-model -p commol-difference -p commol-differential -p commol-calibration -p commol-random -p commol-stochastic -p commol-inference

      # The bindings (py-commol/src/) run only under pytest, so the coverage
      # of Rust joins the Rust tests and pytest on an instrumented extension.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: py-commol/uv.lock

      - name: Install dependencies
        working-directory: ./py-commol
        run: uv sync --locked --extra dev

      # The script fails when the line coverage falls under its threshold.
      - name: Run the Rust and the Python tests with the coverage of Rust
        run: uv run --project py-commol .github/scripts/rust_coverage.sh --lcov --output-path lcov.info

      # cargo llvm-cov does not run the doctests on a stable toolchain.
      - name: Run doctests
        run: cargo test --doc --all-features --workspace

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./lcov.info
          flags: rust
          use_oidc: true
          fail_ci_if_error: false
