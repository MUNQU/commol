name: Release to PyPI

on:
    release:
        types: [published]

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    # The version of maturin that py-commol/uv.lock pins, so every wheel builds
    # with the maturin of the tests and of the sdist, not the latest one.
    maturin:
        name: Read the maturin of the lock
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.lock.outputs.version }}
        steps:
            - uses: actions/checkout@v7

            - name: Read the version of maturin in uv.lock
              id: lock
              run: |
                  python3 -c 'import tomllib; lock = tomllib.load(open("py-commol/uv.lock", "rb")); print("version=" + next(p["version"] for p in lock["package"] if p["name"] == "maturin"))' >> "$GITHUB_OUTPUT"

    build-wheels-linux:
        name: Build wheels on Linux (${{ matrix.target }}) with Python ${{ matrix.python-version }}
        needs: maturin
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [x86_64, aarch64]
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7

            - name: Set version from tag
              uses: ./.github/actions/set-version

            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  maturin-version: ${{ needs.maturin.outputs.version }}
                  target: ${{ matrix.target }}
                  args: --release --out dist --manifest-path py-commol/Cargo.toml --interpreter ${{ matrix.python-version }}
                  sccache: "true"
                  manylinux: auto

            - name: Upload wheels
              uses: actions/upload-artifact@v7
              with:
                  name: wheels-linux-${{ matrix.target }}-py${{ matrix.python-version }}
                  path: dist/*.whl

    build-wheels-windows:
        name: Build wheels on Windows with Python ${{ matrix.python-version }}
        needs: maturin
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7

            - name: Set version from tag
              uses: ./.github/actions/set-version

            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  maturin-version: ${{ needs.maturin.outputs.version }}
                  target: x86_64
                  args: --release --out dist --manifest-path py-commol/Cargo.toml --interpreter ${{ matrix.python-version }}
                  sccache: "true"

            - name: Upload wheels
              uses: actions/upload-artifact@v7
              with:
                  name: wheels-windows-py${{ matrix.python-version }}
                  path: dist/*.whl

    build-wheels-macos:
        name: Build wheels on macOS (${{ matrix.target }}) with Python ${{ matrix.python-version }}
        needs: maturin
        runs-on: macos-latest
        strategy:
            fail-fast: false
            matrix:
                target: [x86_64, aarch64]
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7

            - name: Set version from tag
              uses: ./.github/actions/set-version

            - name: Build wheels
              uses: PyO3/maturin-action@v1
              with:
                  maturin-version: ${{ needs.maturin.outputs.version }}
                  target: ${{ matrix.target }}
                  args: --release --out dist --manifest-path py-commol/Cargo.toml --interpreter ${{ matrix.python-version }}
                  sccache: "true"

            - name: Upload wheels
              uses: actions/upload-artifact@v7
              with:
                  name: wheels-macos-${{ matrix.target }}-py${{ matrix.python-version }}
                  path: dist/*.whl

    build-sdist:
        name: Build source distribution
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set version from tag
              uses: ./.github/actions/set-version

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  version-file: py-commol/pyproject.toml

            # The maturin of uv.lock, as the tests and the wheels use.
            - name: Build sdist
              run: uv run --locked --project py-commol --extra dev maturin sdist --out dist --manifest-path py-commol/Cargo.toml

            - name: Upload sdist
              uses: actions/upload-artifact@v7
              with:
                  name: sdist
                  path: dist/*.tar.gz

    # A published version is final, so the intervals of the uncertainty
    # methods must cover at their level before it is.
    coverage-studies:
        name: Coverage studies
        uses: ./.github/workflows/coverage.yaml

    publish-to-pypi:
        name: Publish to PyPI
        needs:
            [
                build-wheels-linux,
                build-wheels-windows,
                build-wheels-macos,
                build-sdist,
                coverage-studies,
            ]
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/commol
        permissions:
            id-token: write

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  pattern: wheels-*
                  merge-multiple: true

            - name: Download sdist
              uses: actions/download-artifact@v8
              with:
                  path: dist
                  name: sdist

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
