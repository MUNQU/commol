name: Documentation

on:
  push:
    branches: [main]
    # A release tag publishes the documentation of that release as `latest`.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]
  # The merge queue of main tests each pull request on top of the others.
  merge_group:

# A new commit on a pull request cancels the runs of its earlier commits. Push
# runs are never cancelled while running; a newer push only replaces a run that
# is still waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./py-commol

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: py-commol/uv.lock

      - name: Install dependencies
        run: uv sync --locked --extra docs --no-install-project

      - name: Build documentation
        working-directory: ./py-commol
        run: uv run --no-sync mkdocs build --strict -f ../mkdocs.yaml

      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: site/

  deploy-docs:
    name: Deploy Documentation
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: py-commol/uv.lock

      - name: Install dependencies
        working-directory: ./py-commol
        run: uv sync --locked --extra docs --no-install-project

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy latest documentation (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: ./py-commol
        run: |
          uv run --no-sync mike deploy --push --update-aliases latest --config-file ../mkdocs.yaml
          uv run --no-sync mike set-default --push latest --config-file ../mkdocs.yaml

      - name: Deploy development documentation (main branch)
        if: github.ref == 'refs/heads/main'
        working-directory: ./py-commol
        run: |
          uv run --no-sync mike deploy --push --update-aliases dev --config-file ../mkdocs.yaml
