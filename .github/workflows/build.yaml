name: Build

on:
    pull_request:
        branches: [main]
    # The merge queue of main tests each pull request on top of the others, so
    # the tree that reaches main is the tree it tested: a push to main does not
    # run the tests again.
    merge_group:
    # Once a week main runs the whole matrix again, against the latest runner
    # images and dependencies; the badge of the README shows this run.
    schedule:
        - cron: "0 5 * * 1" # Every Monday at 05:00 UTC
    workflow_dispatch:

# A new commit on a pull request cancels the runs of its earlier commits.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    # Whether the change touches more than the documentation and the planning
    # files, which compile nothing (a scheduled or manual run tests
    # everything), and whether a pull request changes what the coverage
    # studies run.
    changes:
        name: Changed files
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.diff.outputs.code }}
            studies: ${{ steps.diff.outputs.studies }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Find files outside the documentation
              id: diff
              env:
                  EVENT: ${{ github.event_name }}
                  QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
              run: |
                  case "$EVENT" in
                      # The checkout is the merge commit; its first parent is main.
                      pull_request) base="HEAD^1" ;;
                      merge_group) base="$QUEUE_BASE" ;;
                      *) echo "code=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
                  esac
                  files=$(git diff --name-only "$base" HEAD)
                  printf '%s\n' "$files"
                  pattern='^(docs/|overrides/|\.github/ISSUE_TEMPLATE/|\.github/scripts/|\.github/PULL_REQUEST_TEMPLATE\.md$|mkdocs\.yaml$|[^/]*\.md$|AUTHORS$|LICENSE$)'
                  if printf '%s\n' "$files" | grep -v -E "$pattern" | grep -q .; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "code=false" >> "$GITHUB_OUTPUT"
                  fi
                  # What the coverage studies run: the uncertainty methods and the
                  # crates they depend on, the difference and stochastic engines of
                  # their models, the bindings, the Python package, the support code
                  # of the tests, and the locks and toolchain that build them
                  # (tests/suite/test_rules.py checks the crates).
                  studies='^(crates/commol-(core|model|difference|stochastic|calibration|random|inference)/|py-commol/(src|commol)/|py-commol/tests/(support/|conftest\.py$|uncertainty/test_[a-z_]*coverage\.py$)|py-commol/(Cargo\.toml|pyproject\.toml|uv\.lock)$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.github/workflows/coverage\.yaml$)'
                  if [ "$EVENT" = "pull_request" ] && printf '%s\n' "$files" | grep -q -E "$studies"; then
                      echo "studies=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "studies=false" >> "$GITHUB_OUTPUT"
                  fi

    # Tests run on the runner's own architecture, so the target architecture
    # does not change them: one job per operating system and Python version.
    # A pull request runs one job, Ubuntu with the oldest Python, for a fast
    # answer; the merge queue, which tests the tree that reaches main, runs
    # the whole matrix, and so do the weekly and the manual runs.
    test:
        name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
        needs: changes
        if: needs.changes.outputs.code == 'true'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
                python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.12", "3.13", "3.14"]') }}

        steps:
            - uses: actions/checkout@v7

            - name: Set up Python ${{ matrix.python-version }}
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ matrix.python-version }}

            - name: Install uv
              uses: astral-sh/setup-uv@v10.3.0
              with:
                  version-file: py-commol/pyproject.toml
                  enable-cache: true
                  cache-dependency-glob: py-commol/uv.lock

            # The toolchain of rust-toolchain.toml (maturin-action reads it too).
            - name: Set up Rust
              run: rustup toolchain install

            - name: Install Python dependencies
              working-directory: ./py-commol
              run: uv sync --locked --extra dev --python ${{ matrix.python-version }}

            - name: Build and install for testing (maturin develop)
              working-directory: ./py-commol
              # The test model kind is for the tests only; wheels never have it.
              run: uv run maturin develop --release --features test-kind

            # The test that compiles the LaTeX description needs latexmk. The
            # time budget of a test is set on Ubuntu, so LaTeX is installed
            # there, and every test is timed there (test_slow_tests_are_listed).
            - name: Install LaTeX
              if: runner.os == 'Linux'
              run: >-
                  sudo apt-get update &&
                  sudo apt-get install --no-install-recommends -y latexmk
                  texlive-latex-base texlive-latex-recommended texlive-fonts-recommended

            # Every test but the coverage studies, which run in the job
            # coverage-studies below; the documentation examples run here too, so
            # the time budget covers them.
            - name: Run tests
              working-directory: ./py-commol
              run: uv run pytest -m "not coverage_study"

    # The coverage studies, for a pull request that changes what they run. The
    # merge queue does not run them again: the pull request already ran them.
    coverage-studies:
        name: Coverage studies
        needs: changes
        if: needs.changes.outputs.studies == 'true'
        uses: ./.github/workflows/coverage.yaml

    # Single required status check for the whole workflow, so the ruleset does
    # not have to list every job. When only the documentation or the planning
    # files change, the tests are skipped and count as passed; the coverage
    # studies pass, or are skipped when nothing they run changes.
    build-passed:
        name: Build Passed
        if: always()
        needs: [changes, test, coverage-studies]
        runs-on: ubuntu-latest
        steps:
            - name: Fail unless the tests passed, or were skipped for a change of documentation
              env:
                  CHANGES: ${{ needs.changes.result }}
                  CODE: ${{ needs.changes.outputs.code }}
                  TESTS: ${{ needs.test.result }}
                  STUDIES_CHANGED: ${{ needs.changes.outputs.studies }}
                  STUDIES: ${{ needs.coverage-studies.result }}
              run: |
                  echo "changes: $CHANGES, code: $CODE, test: $TESTS, studies changed: $STUDIES_CHANGED, studies: $STUDIES"
                  test "$CHANGES" = "success"
                  if [ "$CODE" = "true" ]; then
                      test "$TESTS" = "success"
                  else
                      test "$TESTS" = "skipped"
                  fi
                  if [ "$STUDIES_CHANGED" = "true" ]; then
                      test "$STUDIES" = "success"
                  else
                      test "$STUDIES" = "skipped"
                  fi
