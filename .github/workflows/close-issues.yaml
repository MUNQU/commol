# Close the issues a pull request closes when it merges into develop.
#
# GitHub closes an issue from "Closes #N" only when the pull request merges into
# the default branch, main, but every pull request merges into develop. This
# workflow closes them there, with the keywords GitHub reads.
name: Close Issues

on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    name: Close the issues of the pull request
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Close each issue the body names with close, fix or resolve
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          issues=$(printf '%s\n' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          for issue in $issues; do
            gh issue close "$issue" --repo "$REPO" --reason completed \
              --comment "Closed by #$NUMBER, merged into develop."
          done
