# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Updates run once a month. Minor and patch updates of each ecosystem arrive
# grouped in a single pull request, so the shared lockfile is rebased once
# instead of once per package. Major updates of Python keep a pull request of
# their own; major updates of Rust arrive grouped too, and pyo3 alone.

version: 2
updates:
  - package-ecosystem: "cargo" # Rust workspace (Cargo.toml and Cargo.lock at the root)
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # The cranelift crates must share one version, and each 0.x release is a
      # major update; the whole family moves together. Listed first, because a
      # dependency joins the first group it matches.
      cranelift:
        patterns: ["cranelift*"]
      rust-minor-patch:
        patterns: ["*"]
        # A 0.x minor release of pyo3 changes its API; keep it separate.
        exclude-patterns: ["pyo3*", "cranelift*"]
        update-types: ["minor", "patch"]
      # Major updates also arrive in one pull request, so the Rust updates of a
      # month touch Cargo.lock once.
      rust-major:
        patterns: ["*"]
        exclude-patterns: ["pyo3*", "cranelift*"]
        update-types: ["major"]

  # The Rust version of rust-toolchain.toml: a pull request for each newer
  # stable release, whose CI runs the new clippy lints before they reach a
  # feature branch.
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "uv" # Python dependencies
    directory: "/py-commol"
    schedule:
      interval: "monthly"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions" # Actions used by the workflows
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
