site_name: Commol Documentation
site_description: A high-performance compartment modelling library for mathematical modeling
site_author: MUNQU Team
site_url: https://munqu.github.io/commol
repo_url: https://github.com/MUNQU/commol
repo_name: MUNQU/commol

theme:
  name: material
  custom_dir: overrides # the banner on non-default versions (overrides/main.html)
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search # Search functionality
  - autorefs # Auto cross-references (required by mkdocstrings)
  - mkdocstrings: # API documentation from docstrings
      handlers:
        python:
          paths: [py-commol/] # Add the Python package directory to sys.path
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters:
              - "!^_[^_]"

  # llms.txt (an index for AI agents) and llms-full.txt (every page in one file)
  - llmstxt:
      base_url: https://munqu.github.io/commol/latest/
      full_output: llms-full.txt
      markdown_description: >
        Commol is a Python library, with a Rust engine, to build, simulate and
        calibrate compartment models. Models are built with ModelBuilder,
        simulated with Simulation and fitted with Calibrator. Examples use
        abstract names (bins A, B, C; parameters k1, k2).
      sections:
        Getting started:
          - index.md: Overview and where to go
          - getting-started/*.md
        User guide:
          - guide/core-concepts.md: Compartments, stratifications, transitions, rates, the process and the structure, with runnable examples
          - guide/building-models.md: Every ModelBuilder method and argument, series parameters, validation rules, save and load
          - guide/transitions.md: Absolute and proportional rates, several sources, $compartment, category transitions, per_compartment, stratified rates, what build checks
          - guide/mathematical-expressions.md: Operators, variables, subgroup totals, functions and security limits of rate formulas
          - guide/axis-patterns.md: AxisPattern pulses, windows, ramps, sinusoids, combinations and schedules per subgroup
          - guide/units-and-equations.md: Unit checking of rates, impulses and the step unit
          - guide/describing-models.md: Model.describe, its sections and blocks, text, Markdown, LaTeX, JSON and DOT renderings, the ODD layout
          - guide/simulations.md: Simulation.run, output formats, totals by bin and category, windowed totals, plotting
          - guide/stochastic.md: The StochasticEvents and StochasticSteps engines, how rates become events, whole units, methods, calibration with replicates
          - guide/calibration.md: CalibrationProblem, observations, unknowns, losses, results and writing results back
          - guide/calibration-initial-conditions.md: Calibrating bins, categories and compartments, the remainder and the order of application
          - guide/calibration-observations.md: Several outputs, sums of outputs, weights, scale factors and windowed observations
          - guide/calibration-optimizers.md: Nelder-Mead and particle swarm settings, reproducibility, troubleshooting
          - guide/calibration-constraints.md: Constraints on unknowns and outputs, and how violations count
          - guide/uncertainty/index.md: The three questions, bands and prediction intervals, which method answers which question, the parameter sample, the predictive, scores and the entry point
          - guide/uncertainty/identifiability.md: Structural against practical identifiability, the structural rank, collinearity, a sample, starts, combinations and the report
          - guide/uncertainty/resampling.md: The Bayesian, residual and wild block bootstraps, the block jackknife, block lengths and prediction intervals from residuals
          - guide/uncertainty/smc.md: Priors, the sequential Monte Carlo sampler, the Gibbs posterior and its scale eta, ABC and its distances, and the diagnostics
          - guide/uncertainty/observation-models.md: Observation models of each series, noise parameters, maximum likelihood, the Bayesian posterior and its evidence, prediction intervals with noise, the log score and the parametric bootstrap
          - guide/uncertainty/conformal.md: Conformal prediction intervals, the guarantee, scores and pooling, split, rolling origins, jackknife+ and CV+, EnbPI, adaptive conformal, plots and reports
          - guide/uncertainty/sensitivity.md: Forward questions with no data, input spaces, quantities of interest, propagation, PRCC, Morris screening, Sobol indices, polynomial chaos and their plots
          - guide/uncertainty/profiles.md: Profile likelihood of parameters and predictions, how to read a profile, the chi-square, Beale and bootstrap thresholds, the adaptive step, verdicts, the report and plots
          - guide/reports.md: applied_parameters_report and simulation_report
          - guide/examples.md: Complete models
        API reference:
          - api/*.md
          - advanced/model-structure.md: The data model of a Model
        Changelog:
          - about/changelog.md: Every change, breaking ones marked

# Broken links and anchors fail `mkdocs build --strict`.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - pymdownx.highlight: # Code highlighting
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences: # Fenced code blocks, and mermaid diagrams
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Admonitions (note/warning/tip boxes)
  - admonition # Basic admonitions
  - pymdownx.details # Collapsible admonitions
  # Content features
  - tables # Markdown tables
  - toc: # Table of contents
      permalink: true # Anchor links to headings
  - pymdownx.inlinehilite # Inline code highlighting
  - pymdownx.tabbed: # Tabbed content (for multi-platform examples)
      alternate_style: true
  - attr_list # HTML attributes (for styling)
  - md_in_html # Markdown in HTML blocks
  - pymdownx.snippets: # AGENTS.md owns the task table and the commands
      base_path: !relative $config_dir # the root, from any working directory
      check_paths: true # a missing snippet fails the build

