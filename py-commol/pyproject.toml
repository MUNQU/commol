[project]
name = "commol"
dynamic = ["version"]
description = "High-performance declarative dynamical modelling in Python."
authors = [
    {name = "Rafael J. Villanueva Micó", email = "rjvillan@imm.upv.es"},
    {name = "Carlos Andreu Vilarroig", email = "caranvi1@upv.es"},
    {name = "David Martínez Rodríguez", email = "damarro3@upv.es"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12.0"
keywords = [
    "dynamical systems",
    "compartmental models",
    "differential equations",
    "simulation",
    "calibration",
    "parameter estimation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "cffi (>=2.1.0,<3.0)",
    "numpy (>=2.5.1,<3.0)",
    "pint>=0.25.3,<0.27.0",
    "pydantic (>=2.13.4,<3.0)",
    "seaborn (>=0.13.2,<0.14.0)",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.9.1,<1.16.0",
    "pre-commit>=3.8,<5.0",
    "pydot>=4.0,<5.0",
    "pytest>=9.0,<10.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<0.18",
    "twine>=6.2.0,<8.0.0",
    "ty>=0.0.9,<0.0.87",
    "vulture (>=2.16,<3.0)",
]
docs = [
    "mike>=2.2.0,<3.0",
    "mkdocs>=1.6,<2.0",
    "mkdocstrings[python]>=0.26,<2.0",
    "mkdocs-autorefs>=1.4.4,<2.0",
    "mkdocs-material>=9.7.6,<10.0",
    "mkdocs-llmstxt>=0.5,<0.6",
]

[project.urls]
Homepage = "https://github.com/MUNQU/commol"
Documentation = "https://munqu.github.io/commol"
Repository = "https://github.com/MUNQU/commol"
"Bug Tracker" = "https://github.com/MUNQU/commol/issues"

# Build system
[build-system]
requires = ["maturin>=1.9.1,<1.16.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "."
module-name = "commol.commol_rs._commol_rs"

# Testing configuration
[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--log-cli-level=WARN -m 'not coverage_study'"
filterwarnings = ["error::pytest.PytestRemovedIn10Warning"]
markers = [
    "docs: checks the documentation, its examples and its API coverage (tests/docs/)",
    "coverage_study: checks that the intervals of a method cover at their nominal rate; excluded by default, run with -m coverage_study (weekly in CI)",
]
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Linting and formatting
[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    ".zed",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "target",
    ".vulture_allowlist.py",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
# D1 and D417: every public module, class, function and argument is documented.
# N: names follow PEP 8 (pep8-naming).
select = ["E", "F", "C90", "ARG", "ERA", "B007", "D1", "D417", "N"]
fixable = ["ALL"]
unfixable = []
ignore = [
    "ERA001",  # Allow explanatory comments that look like commented code
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false

[tool.ty.src]
exclude = [".vulture_allowlist.py"]
