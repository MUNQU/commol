[package]
name = "commol"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Python bindings of commol"

[lib]
name = "_commol_rs"
crate-type = ["cdylib"]

[features]
# The model kind of the tests and its engine. The test suite builds with it
# (`maturin develop --release --features test-kind`); a release build never does.
test-kind = ["commol-core/test-kind"]

[dependencies]
pyo3 = { workspace = true }
serde_json = { workspace = true }
commol-core = { path = "../crates/commol-core" }
commol-model = { path = "../crates/commol-model" }
commol-difference = { path = "../crates/commol-difference" }
commol-differential = { path = "../crates/commol-differential" }
commol-stochastic = { path = "../crates/commol-stochastic" }
commol-calibration = { path = "../crates/commol-calibration" }
commol-inference = { path = "../crates/commol-inference" }
commol-random = { path = "../crates/commol-random" }
commol-statistics = { path = "../crates/commol-statistics" }
rayon = { workspace = true }

# Required for custom argmin observer
argmin = { workspace = true }
