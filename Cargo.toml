[workspace]
resolver = "3"
members = [
    "crates/*",
    "py-commol"
]
default-members = [
  "crates/*",
  "py-commol"
]

[workspace.package]
version = "0.1.0"
authors = [
    "Rafael J. Villanueva Micó <rjvillan@imm.upv.es>",
    "Carlos Andreu Vilarroig <caranvi1@upv.es>",
    "David Martínez Rodríguez <damarro3@upv.es>"
]
edition = "2024"
homepage = "https://github.com/MUNQU/commol"
license = "MIT"
repository = "https://github.com/MUNQU/commol"

# The dependencies that more than one crate uses; a crate names them with
# `{ workspace = true }`, and may add features.
[workspace.dependencies]
argmin = { git = "https://github.com/MUNQU/argmin", branch = "development" }
argmin-math = { git = "https://github.com/MUNQU/argmin", branch = "development" }
finitediff = { git = "https://github.com/MUNQU/argmin", branch = "development" }
libm = "0.2.15"
pyo3 = { version = "0.29.3", features = ["extension-module", "serde"] }
rayon = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1.20"
json5 = "1.3.4"
serde-value = "0.7.0"
