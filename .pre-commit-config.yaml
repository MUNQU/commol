repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
      - id: ty-check
        name: ty check
        entry: bash -c "cd py-commol && uv run ty check commol"
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: vulture
        entry: bash -c "cd py-commol && uv run vulture commol .vulture_allowlist.py --min-confidence 80"
        language: system
        pass_filenames: false
        types: [python]
      # ruff runs from uv.lock, as CI does (`uv run ruff …` in
      # code-quality.yaml), so Dependabot updates the version of both. It
      # covers the same files as CI: everything under py-commol/, README.md
      # included through its symlink.
      - id: ruff-check
        name: ruff check
        entry: bash -c "cd py-commol && uv run ruff check --fix ."
        language: system
        pass_filenames: false
        files: ^(py-commol/|README\.md$)
        types_or: [python, pyi, jupyter, markdown]
      - id: ruff-format
        name: ruff format
        entry: bash -c "cd py-commol && uv run ruff format ."
        language: system
        pass_filenames: false
        files: ^(py-commol/|README\.md$)
        types_or: [python, pyi, jupyter, markdown]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.33
    hooks:
      - id: uv-lock
        files: ^py-commol/(pyproject\.toml|uv\.lock)$
        args: ["--project", "py-commol"]
