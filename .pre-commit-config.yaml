repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
      - id: ty-check
        name: ty check
        entry: bash -c "cd py-commol && uv run ty check commol"
        language: system
        pass_filenames: false
        types: [python]
      - id: vulture
        name: vulture
        entry: bash -c "cd py-commol && uv run vulture commol .vulture_allowlist.py --min-confidence 80"
        language: system
        pass_filenames: false
        types: [python]
      # ruff runs from uv.lock, as CI does (`uv run ruff …` in
      # code-quality.yaml), so Dependabot updates the version of both. It
      # covers the same files as CI: everything under py-commol/ and
      # .github/scripts/, README.md included through its symlink.
      - id: ruff-check
        name: ruff check
        entry: bash -c "cd py-commol && uv run ruff check --fix . ../.github/scripts"
        language: system
        pass_filenames: false
        files: ^(py-commol/|\.github/scripts/|README\.md$)
        types_or: [python, pyi, jupyter, markdown]
      - id: ruff-format
        name: ruff format
        entry: bash -c "cd py-commol && uv run ruff format . ../.github/scripts"
        language: system
        pass_filenames: false
        files: ^(py-commol/|\.github/scripts/|README\.md$)
        types_or: [python, pyi, jupyter, markdown]
      # The uv of the machine, which refuses to run unless it is the version
      # of `required-version` in py-commol/pyproject.toml, the one CI installs.
      - id: uv-lock
        name: uv lock
        entry: uv lock --check --project py-commol
        language: system
        pass_filenames: false
        files: ^py-commol/(pyproject\.toml|uv\.lock)$
