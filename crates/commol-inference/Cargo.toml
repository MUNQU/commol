[package]
name = "commol-inference"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Uncertainty and identifiability methods for Commol calibration problems"

[lib]
name = "commol_inference"
crate-type = ["rlib"]

[dependencies]
commol-calibration = { path = "../commol-calibration" }
commol-core = { path = "../commol-core" }
commol-random = { path = "../commol-random" }
anyhow = "1.0"
finitediff = { git = "https://github.com/MUNQU/argmin", branch = "development" }
libm = "0.2.15"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
rayon = "1.11"

[dev-dependencies]
commol-difference = { path = "../commol-difference" }
commol-differential = { path = "../commol-differential" }
commol-stochastic = { path = "../commol-stochastic" }
serde_json = "1.0"
