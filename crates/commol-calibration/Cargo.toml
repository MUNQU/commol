[package]
name = "commol-calibration"
version = "0.1.0"
edition = "2021"
authors = ["Commol Contributors"]
description = "Model calibration and parameter estimation for Commol"
license = "MIT"

[lib]
name = "commol_calibration"
crate-type = ["rlib"]

[dependencies]
# Optimization library
argmin = { git = "https://github.com/MUNQU/argmin", branch = "development", features = ["rand", "rayon"] }
argmin-math = { git = "https://github.com/MUNQU/argmin", branch = "development" }

# Commol dependencies
commol-core = { path = "../commol-core" }
commol-random = { path = "../commol-random" }

libm = "0.2.15"

# Random number generation
rand = "0.10"

# Parallel processing
rayon = "1.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
commol-difference = { path = "../commol-difference" }
commol-differential = { path = "../commol-differential" }
