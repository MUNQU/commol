[package]
name = "commol-calibration"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Model calibration and parameter estimation for Commol"

[lib]
name = "commol_calibration"
crate-type = ["rlib"]

[dependencies]
# Optimization library
argmin = { workspace = true, features = ["rand", "rayon"] }
argmin-math = { workspace = true }

# Commol dependencies
commol-core = { path = "../commol-core" }
commol-random = { path = "../commol-random" }

libm = { workspace = true }

# Parallel processing
rayon = { workspace = true }

# Serialization
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
commol-difference = { path = "../commol-difference" }
commol-differential = { path = "../commol-differential" }
commol-stochastic = { path = "../commol-stochastic" }
