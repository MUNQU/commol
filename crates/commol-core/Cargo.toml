[package]
name = "commol-core"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Core data structures for compartment models"

[lib]
name = "commol_core"
crate-type = ["rlib"]

[features]
# The model kind of the tests (`types::test_kind`). Never in a release build.
test-kind = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.12", features = ["serde"] }
rayon = "1.11"
thiserror = "2.0"
evalexpr = "13.1"
# The math functions of the JIT that the standard library does not have
libm = "0.2.15"

# Cranelift JIT compiler
cranelift = "0.126"
cranelift-jit = "0.126"
cranelift-module = "0.126"
cranelift-codegen = "0.126"
