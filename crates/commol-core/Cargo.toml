[package]
name = "commol-core"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Core data structures for compartment models"

[lib]
name = "commol_core"
crate-type = ["rlib"]

[features]
# The model kind of the tests (`types::test_kind`). Never in a release build.
test-kind = []

[dependencies]
commol-statistics = { path = "../commol-statistics" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
indexmap = { version = "2.12", features = ["serde"] }
rayon = { workspace = true }
thiserror = "2.0"

# Cranelift JIT compiler. On Linux and macOS, `selinux-fix` maps the memory of
# compiled code (`mmap`) instead of taking it from the heap, which SELinux
# forbids to make executable (`execheap`): `tests/jit_memory.rs`.
cranelift = "0.126"
cranelift-jit = { version = "0.126", features = ["selinux-fix"] }
cranelift-module = "0.126"
cranelift-codegen = "0.126"

# `jit_memory` runs its own `main` on the main thread, where glibc serves the
# allocator from the heap of `brk`.
[[test]]
name = "jit_memory"
harness = false
